[project]
name = "demo-agent"
version = "0.1.0"
description = "Offline LangGraph demo graphs for exercising lgview. No API keys required."
requires-python = ">=3.10"
dependencies = ["langgraph>=0.2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
